<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Remplacé par l'adresse du site au moment de la fabrication (--base-href). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Bario, gestion de bar et club : serveuses, bar, caisse, stock.">

  <!-- iPhone : appli sur l'écran d'accueil -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bario">
  <meta name="theme-color" content="#0B0C10">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>Bario</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0B0C10; }
    #chargement {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #ECEDF2;
    }
    #chargement svg { width: 64px; height: 64px; }
    #chargement .nom { font-size: 40px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
    #chargement .barre { width: 120px; height: 3px; background: #1B1E26; border-radius: 2px; overflow: hidden; margin-top: 10px; }
    #chargement .barre::after { content: ''; display: block; width: 40%; height: 100%; background: #A594F9; animation: aller 1.2s ease-in-out infinite; }
    @keyframes aller { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="chargement">
    <svg viewBox="0 0 100 100" aria-hidden="true"><rect x="18" y="8" width="15" height="84" rx="7.5" fill="#A594F9"/><circle cx="57" cy="63" r="21.5" fill="none" stroke="#A594F9" stroke-width="15"/><circle cx="80" cy="17" r="8" fill="#A594F9"/></svg>
    <div class="nom">bario</div>
    <div class="barre"></div>
  </div>
  <script>
    // Garde l'application sur l'appareil pour qu'elle s'ouvre même sans internet.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
    window.addEventListener('flutter-first-frame', function () {
      var c = document.getElementById('chargement');
      if (c) c.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
