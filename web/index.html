<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Remplacé par l'adresse du site au moment de la fabrication (--base-href). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Bario, gestion de bar et club : serveuses, bar, caisse, stock.">

  <!-- iPhone : appli sur l'écran d'accueil -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bario">
  <meta name="theme-color" content="#0A0E1A">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>Bario</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0A0E1A; }
    #chargement {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #EAF0FA;
    }
    #chargement .pastille {
      width: 72px; height: 72px; border-radius: 22px; display: grid; place-items: center;
      background: linear-gradient(135deg, #1FD1B9, #7C5CFF, #FF7A59); color: #0A0E1A;
      font-size: 50px; font-weight: 900; line-height: 1; box-shadow: 0 0 32px rgba(31, 209, 185, .3);
    }
    #chargement .nom { font-size: 40px; font-weight: 900; letter-spacing: -1px; }
    #chargement .nom i { color: #FF7A59; font-style: normal; }
    #chargement .barre { width: 120px; height: 4px; background: #1A2236; border-radius: 4px; overflow: hidden; margin-top: 8px; }
    #chargement .barre::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #1FD1B9, #7C5CFF, #FF7A59); animation: aller 1.2s ease-in-out infinite; }
    @keyframes aller { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="chargement">
    <div class="pastille">b</div>
    <div class="nom">bario<i>.</i></div>
    <div class="barre"></div>
  </div>
  <script>
    // Garde l'application sur l'appareil pour qu'elle s'ouvre même sans internet.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
    window.addEventListener('flutter-first-frame', function () {
      var c = document.getElementById('chargement');
      if (c) c.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
